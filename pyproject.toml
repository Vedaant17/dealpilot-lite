[project]
name = "dealpilot-lite"
version = "0.1.0"
description = "Agentic AI Private Equity Screening Assistant"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi[standard]==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "langgraph==1.2.24",
    "langchain-core==1.8.4",
    "mcp[cli]==2.3.0",
    "openai==3.57.0",
    "numpy==2.5.5",
    "faiss-cpu==1.16.0",
    "pypdf==5.9.0",
    "tenacity==9.2.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]